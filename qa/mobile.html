<!DOCTYPE html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모바일 미리보기 (390px)</title>
<style>
  html,body{margin:0;background:#222;font-family:system-ui,sans-serif;color:#ddd}

<body>
<div class="wrap">
  <div>
    <div class="device"><iframe src="../index.html?debug=1" title="mobile preview"></iframe></div>

  </div>
</div>

</html>
